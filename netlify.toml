[build]
  command = "npm run build"
  publish = "dist"

# The admin function (secret key, ESG lead only) under /api; listed first so the SPA rule below never shadows it
[[redirects]]
  from = "/api/admin-users"
  to = "/.netlify/functions/admin-users"
  status = 200

# Single-page app: every route is served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
